<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SmartPay</title>

    <!-- Common SmartPay Design -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            SmartPay
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="logout.html">Logout</a>
        </nav>

    </header>


    <main class="login-container">

        <div class="login-card">

            <div class="login-header">

                <div class="login-icon">
                    🔐
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your SmartPay account
                </p>

            </div>


            <!-- Login Form -->

            <form id="loginForm">

                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <small id="emailError"></small>

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                    <small id="passwordError"></small>

                </div>


                <!-- Remember Me -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to SmartPay
                </button>


                <!-- Message -->

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <!-- Register -->

            <div class="register-link">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>


            <!-- Back Home -->

            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </main>


    <!-- Login JavaScript -->

    <script src="js/login.js"></script>

</body>
</html>
